
name: Build MOODI Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build MOODI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: moodi_flutter_app

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.moodi --project-name moodi_app --no-pub .
          rm -f test/widget_test.dart

      - name: Configure Bluetooth permissions
        run: python3 scripts/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moodi-android-apk
          path: moodi_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
